version: 2.1

jobs:
  build-debug:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    parallelism: 30
    steps:
      - checkout
      - run:
          name: Unpack sources
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Configure
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run:
          name: Build
          command: cmake --build build --target build-debug -j4
      - run:
          name: Build debug
          command: ./build/build-debug

workflows:
  main:
    jobs:
      - build-debug
